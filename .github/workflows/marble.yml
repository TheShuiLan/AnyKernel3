# ========================================
# Melt Kernel 构建（Redmi Note 12 Turbo / Poco F5）
# ========================================
# 上游: https://github.com/Pzqqt/android_kernel_xiaomi_marble
# 分支: melt-rebase   内核 5.10.x   设备: marble / marblein
#
# 编译方式完全对齐上游作者本人的 CI（bouquet_ci 分支的
# .github/workflows/build.yml + build_bouquet.sh）：
#   - 工具链: Slim LLVM 23.1.6
#     https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-23.1.6-x86_64.tar.xz
#   - make: ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out
#           KCFLAGS="-D__ANDROID_COMMON_KERNEL__ -O3"
#           KBUILD_LDFLAGS="-O3 --lto-O3"
#   - KernelSU: tiann/KernelSU（GKI 模式，非 setup.sh）
#   - SUSFS:    susfs4ksu gki-android12-5.10
#
# 与 main.yml（GKI 通用构建）是两套独立流程，互不影响。
#
# 功能支持情况：
#   ✅ CVE-2026-43499 rtmutex 修复链：5.10 在 apply_cve_2026_43499.sh
#      的支持列表内（patch_chain_is_required 对 5.10 恒为 true）。
#      marble 的 rtmutex.c 目录布局与 GKI 一致，脚本可直接以 kernel/
#      为根运行；若内核已含修复，脚本会自动识别并跳过。
#   ❌ BBG / 网络增强 / Re-Kernel / NoMount / ZRAM 补丁栈 /
#      Droidspaces：依赖 GKI 的 gki_defconfig、modules.bzl、kleaf
#      等结构，本设备树内核不适用。
# ========================================

name: 构建 Melt 内核

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 源码 ====================
      kernel_repo:
        description: "内核源码仓库"
        required: false
        type: string
        default: "https://github.com/Pzqqt/android_kernel_xiaomi_marble.git"
      kernel_branch:
        description: "源码分支或 tag"
        required: false
        type: choice
        options:
          - "Melt-marble-v5.3（melt-rebase 发布快照，推荐）"
          - "melt-rebase"
          - "melt-rebase-hyperos"
          - "melt-rebase-los-xiaomi-touch"
          - "melt-rebase-los-compatible"
          - "bouquet"
          - "custom"
        default: "Melt-marble-v5.3（melt-rebase 发布快照，推荐）"
      kernel_branch_custom:
        description: "自定义源码分支（仅当上面选 custom 时生效）"
        required: false
        type: string
        default: ""
      build_script_branch:
        description: "build_bouquet.sh 所在分支（该脚本仅存在于 bouquet_ci）"
        required: false
        type: string
        default: "bouquet_ci"
      kernel_commit:
        description: "指定提交（留空=分支 HEAD）"
        required: false
        type: string
        default: ""

      # ==================== 编译 ====================
      defconfig:
        description: "defconfig"
        required: false
        type: string
        default: "marble_defconfig"
      slim_llvm_version:
        description: "Slim LLVM 版本（上游 build_bouquet.sh 写死 23.1.6，改此项需确认上游脚本已更新）"
        required: false
        type: choice
        options:
          - "23.1.6"
        default: "23.1.6"
      version_suffix:
        description: "自定义内核版本后缀（通过 LOCALVERSION 注入，与上游默认 -<sha> 合并）"
        required: false
        type: string
        default: ""

      # ==================== KernelSU / SUSFS ====================
      ksu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - tiann
          - bakasu
          - sukisu-nova
          - finasu
        default: tiann
      ksu_commit:
        description: "KernelSU 提交（留空=分支 HEAD）"
        required: false
        type: string
        default: ""
      ksu_mode:
        description: "KernelSU / SUSFS 模式（仅SUSFS=只编 KernelSU+SUSFS 一份，最快；关闭=编基础+KSU+KSU&SUSFS 三份）"
        required: true
        type: choice
        options:
          - "仅SUSFS"
          - "关闭"
          - "禁用SUSFS"
          - "禁用KSU"
        default: "仅SUSFS"

      # ==================== 功能补丁 ====================
      use_zram:
        description: "启用 ZRAM 压缩算法（LZ4K/LZ4KD + ARM64 NEON；ZRAM 保持模块以兼容 vendor_boot 打包）"
        required: false
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 基带保护"
        required: false
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "启用 NoMount 挂载元模块（需自行刷入配套模块）"
        required: false
        type: boolean
        default: false
      use_net_enhance:
        description: "启用网络增强（IPSet + Qdisc + WireGuard + CIFS；不含 BBRv3 内核补丁）"
        required: false
        type: boolean
        default: false
      wlan_fix:
        description: "marble WiFi 驱动修复（用 marble-wlan-driver 仓库源码整体替换 QCA6490 WLAN 驱动栈）"
        required: false
        type: boolean
        default: false
      wlan_repo:
        description: "WiFi 驱动仓库（wlan_fix=true 时生效）"
        required: false
        type: string
        default: "https://github.com/TheShuiLan/marble-wlan-driver.git"
      wlan_ref:
        description: "WiFi 驱动仓库分支/tag（wlan_fix=true 时生效）"
        required: false
        type: string
        default: "main"

      # ==================== 构建时间 ====================
      build_time:
        description: "自定义构建时间（UTS_VERSION，留空=内核默认）(示例 Tue Dec  1 08:10:00 UTC 2026)"
        required: false
        type: string
        default: ""

      # ==================== 打包模板 ====================
      package_template:
        description: "打包模板（决定刷机时接受哪些系统）"
        required: true
        type: choice
        options:
          - "Marble-Melt（接受原厂 HyperOS / MIUI）"
          - "Marble-Bouquet（仅 LineageOS 等 OSS 内核 ROM）"
        default: "Marble-Melt（接受原厂 HyperOS / MIUI）"

      # ==================== 安全补丁 ====================
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链（内核已含则自动跳过）"
        required: true
        type: boolean
        default: true
      skip_incompatible:
        description: "补丁不适用时自动跳过（不中断构建）"
        required: false
        type: boolean
        default: true

      # ==================== 发布 ====================
      release_type:
        description: "发布类型"
        required: true
        type: choice
        options:
          - Actions
          - Pre-Release
          - Release
        default: Actions

env:
  KERNEL_REPO: ${{ inputs.kernel_repo }}
  # kernel_branch 的选项可能带中文注释后缀（如 "Melt-marble-v5.3（...）"），
  # GitHub Actions 表达式没有 substring-before，无法在这里截断。
  # 因此这里只处理 custom 与直传两种情况；带后缀的值在
  # 「解析源码引用」步骤里截断后写回 GITHUB_ENV 覆盖。
  KERNEL_BRANCH_RAW: ${{ inputs.kernel_branch == 'custom' && inputs.kernel_branch_custom != '' && inputs.kernel_branch_custom || inputs.kernel_branch }}
  DEFCONFIG: ${{ inputs.defconfig }}
  SLIM_LLVM: ${{ inputs.slim_llvm_version }}
  # 上游脚本的产物目录
  # 上游 build_bouquet.sh 的 OUTPUT_DIR 写作 ~/Bouquet_marble_out，
  # 即 $HOME 下。GitHub Actions 的 env 不做 shell 展开，因此这里不定义
  # OUT_DIR，改为各步骤内 export OUT_DIR="$HOME/Bouquet_marble_out"。
  # 此前写成 ${{ github.workspace }}/build_toolchain/... 与之不符，
  # 导致所有 $OUT_DIR 拷贝都指向不存在的目录（编译成功后才暴露）。
  SKIP_INCOMPATIBLE: ${{ inputs.skip_incompatible }}

jobs:
  build-marble:
    name: "Melt ${{ inputs.kernel_branch }}${{ inputs.kernel_branch == 'custom' && inputs.kernel_branch_custom != '' && format(' ({0})', inputs.kernel_branch_custom) || '' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_DIR: /home/runner/.ccache

    steps:
      - name: 解析源码引用（分支或 tag）
        run: |
          # KERNEL_BRANCH_RAW 可能带中文注释后缀，例如
          #   "Melt-marble-v5.3（melt-rebase 发布快照，推荐）"
          # 实际 git 引用名是「（」之前的部分。
          # 截断后写入 GITHUB_ENV，后续步骤的 $KERNEL_BRANCH 即可直接使用。
          REF="$KERNEL_BRANCH_RAW"
          case "$REF" in
            *（*) REF="${REF%%（*}" ;;
          esac
          # 去掉可能的尾随空白
          REF="$(printf '%s' "$REF" | sed -e 's/[[:space:]]*$//')"
          echo "KERNEL_BRANCH=$REF" >> "$GITHUB_ENV"
          echo "解析源码引用: '$KERNEL_BRANCH_RAW' -> '$REF'"

      - name: 构建信息摘要
        run: |
          {
            echo "## Melt Kernel 构建"
            echo ""
            echo "| 项目 | 值 |"
            echo "|:---|:---|"
            echo "| 源码 | \`$KERNEL_REPO\` |"
            echo "| 分支 | \`$KERNEL_BRANCH\` |"
            echo "| 打包模板 | \`${{ inputs.package_template }}\` |"
            echo "| 提交 | \`${{ inputs.kernel_commit || 'HEAD' }}\` |"
            echo "| defconfig | \`$DEFCONFIG\` |"
            echo "| 工具链 | Slim LLVM $SLIM_LLVM |"
            echo "| KSU 变体 | ${{ inputs.ksu_variant }} |"
            echo "| KSU 模式 | ${{ inputs.ksu_mode }} |"
            echo "| ZRAM | ${{ inputs.use_zram }} |"
            echo "| BBG | ${{ inputs.use_bbg }} |"
            echo "| Re-Kernel | ${{ inputs.use_rekernel }} |"
            echo "| NoMount | ${{ inputs.use_nomount }} |"
            echo "| 网络增强 | ${{ inputs.use_net_enhance }} |"
            echo "| CVE-2026-43499 | ${{ inputs.cve_2026_43499_patch }} |"
            echo "| 兼容跳过 | ${{ inputs.skip_incompatible }} |"
          } >> $GITHUB_STEP_SUMMARY

      - name: 推导构建变体
        run: |
          # ksu_mode 推出产物的构建意图：
          #   仅SUSFS    -> 只编 KSU+SUSFS 一份（省两轮编译，产物仍占满三个槽位）
          #   关闭       -> 基础 + KSU + KSU&SUSFS
          #   禁用SUSFS  -> 基础 + KSU
          #   禁用KSU    -> 仅基础
          case "${{ inputs.ksu_mode }}" in
            "仅SUSFS")
              echo "BUILD_BASE=false"  >> $GITHUB_ENV
              echo "BUILD_KSU=false"   >> $GITHUB_ENV
              echo "BUILD_SUSFS=true"  >> $GITHUB_ENV
              echo "SINGLE_VARIANT=true" >> $GITHUB_ENV
              ;;
            "禁用KSU")
              echo "BUILD_BASE=true"  >> $GITHUB_ENV
              echo "BUILD_KSU=false"  >> $GITHUB_ENV
              echo "BUILD_SUSFS=false" >> $GITHUB_ENV
              echo "SINGLE_VARIANT=false" >> $GITHUB_ENV
              ;;
            "禁用SUSFS")
              echo "BUILD_BASE=true"  >> $GITHUB_ENV
              echo "BUILD_KSU=true"   >> $GITHUB_ENV
              echo "BUILD_SUSFS=false" >> $GITHUB_ENV
              echo "SINGLE_VARIANT=false" >> $GITHUB_ENV
              ;;
            *)
              echo "BUILD_BASE=true"  >> $GITHUB_ENV
              echo "BUILD_KSU=true"   >> $GITHUB_ENV
              echo "BUILD_SUSFS=true" >> $GITHUB_ENV
              echo "SINGLE_VARIANT=false" >> $GITHUB_ENV
              ;;
          esac
          echo "构建变体已写入 GITHUB_ENV（基础/KSU/SUSFS/单一变体）"

      # e652cd9 改用 Slim LLVM 时移除了 checkout，此后 workflow 一直无法
      # 访问本仓库文件；security_patch/ 与 scripts/ 的引用全部落空
      # （bash 报 exit 127）。CVE 步骤因 skip_incompatible 掩盖了该失败，
      # 新增的功能补丁步骤没有同类兜底，直接中断。
      - name: 检出本仓库（补丁脚本资源）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: 缓存 Slim LLVM
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ~/build_toolchain/llvm-${{ inputs.slim_llvm_version }}-x86_64.tar.xz
          key: llvm-${{ inputs.slim_llvm_version }}-x86_64

      - name: 下载 Slim LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/build_toolchain
          cd ~/build_toolchain
          URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-${SLIM_LLVM}-x86_64.tar.xz"
          echo "下载 $URL"
          curl -L --retry 5 --retry-delay 5 -o "llvm-${SLIM_LLVM}-x86_64.tar.xz" "$URL"

      - name: 解压工具链
        run: |
          set -euo pipefail
          cd ~/build_toolchain
          tar -xJf "llvm-${SLIM_LLVM}-x86_64.tar.xz"
          ls -1
          # 记录 bin 目录，供后续步骤加入 PATH
          BIN_DIR=$(find ~/build_toolchain -maxdepth 2 -type d -name bin | head -1)
          echo "LLVM_BIN=$BIN_DIR" >> $GITHUB_ENV
          echo "工具链路径: $BIN_DIR"
          "$BIN_DIR/clang" --version

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aria2 bc bison build-essential ccache cpio curl flex git \
            libelf-dev libssl-dev libncurses-dev lz4 python3 python3-pip \
            rsync unzip wget xz-utils zip zstd
          sudo pip3 install --no-cache-dir rich

      # 编译加速：ccache 缓存编译产物，命中后可显著缩短全量编译时间。
      # 原流程完全没有配置 ccache（虽装了软件包但未启用），
      # 每次都是冷编译，约 26 分钟。
      - name: 恢复 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # 按工具链版本 + 源码分支分组；恢复时允许跨提交复用
          # （ccache 自身按预处理器哈希判定命中，跨提交是安全的）
          key: ccache-${{ runner.os }}-${{ inputs.slim_llvm_version }}-${{ inputs.kernel_branch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ inputs.slim_llvm_version }}-${{ inputs.kernel_branch }}-
            ccache-${{ runner.os }}-${{ inputs.slim_llvm_version }}-

      - name: 配置 ccache
        run: |
          export PATH="$LLVM_BIN:$PATH"
          ccache --version
          ccache --max-size=3G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          # 不同源码树/不同内核配置也能正确区分：ccache 默认按
          # 预处理后的源码内容 + 编译命令行哈希，天然安全。
          ccache -z
          ccache -s

      - name: 克隆内核源码
        run: |
          set -euo pipefail
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          if [ -n "${{ inputs.kernel_commit }}" ]; then
            git fetch --depth=1 origin "${{ inputs.kernel_commit }}"
            git checkout "${{ inputs.kernel_commit }}"
          fi
          echo "KERNEL_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "KERNEL_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u '+%Y%m%d')" >> $GITHUB_ENV

      - name: 应用自定义构建时间
        if: inputs.build_time != ''
        working-directory: kernel
        run: |
          set -euo pipefail
          # 5.10 走 build.yml 的 5.x 经典分支：直接替换 UTS_VERSION 生成表达式。
          # scripts/ 不在任何 cleanup 列表内，补丁跨三轮编译存活。
          DATESTR="${{ inputs.build_time }}"
          f="scripts/mkcompile_h"
          if [ ! -f "$f" ]; then
            echo "::error::未找到 $f"
            exit 1
          fi
          if grep -q 'UTS_VERSION="#1 SMP PREEMPT' "$f"; then
            echo "mkcompile_h 已包含自定义时间，跳过"
            exit 0
          fi
          perl -pi -e "s{UTS_VERSION=\"\\\$\(echo \\\$UTS_VERSION \\\$CONFIG_FLAGS \\\$TIMESTAMP \\| cut -b -\\\$UTS_LEN\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
          if ! grep -qF "$DATESTR" "$f"; then
            echo "::error::mkcompile_h 时间戳替换失败（上游结构可能已变化）"
            grep -n 'UTS_VERSION' "$f"
            exit 1
          fi
          echo "已固定构建时间: $DATESTR"

      - name: 安装构建脚本与 build-tools
        working-directory: kernel
        run: |
          set -euo pipefail
          BB_REPO="https://github.com/Pzqqt/android_kernel_xiaomi_marble.git"
          BB_BRANCH="${{ inputs.build_script_branch }}"

          if [ -f build_bouquet.sh ] && [ -f build-tools/merge_dtbs.py ]; then
            echo "源码分支已自带构建脚本与 build-tools"
            chmod +x build_bouquet.sh build-tools/*
          else
            echo "源码分支缺构建脚本，从 ${BB_BRANCH} 取"
            # 用 blob:none 部分克隆 + cat-file 单文件提取。
            # 不检出工作树：上游树里有 aux.c 等 Windows 保留名，
            # checkout 在部分环境会直接报 invalid path；cat-file 不受影响。
            TMP=$(mktemp -d)
            trap 'rm -rf "$TMP"' EXIT
            git init -q "$TMP"
            git -C "$TMP" remote add origin "$BB_REPO"
            git -C "$TMP" fetch --depth=1 --no-tags origin "$BB_BRANCH"
            REF=$(git -C "$TMP" rev-parse FETCH_HEAD)
            echo "脚本分支 ${BB_BRANCH} -> ${REF}"

            git -C "$TMP" cat-file -p "${REF}:build_bouquet.sh" > build_bouquet.sh
            rm -rf build-tools
            mkdir -p build-tools
            for t in avbtool fdtget fdtoverlay fdtoverlaymerge fdtput \
                     merge_dtbs.py mkdtboimg.py ufdt_apply_overlay; do
              git -C "$TMP" cat-file -p "${REF}:build-tools/$t" > "build-tools/$t"
            done
            chmod +x build_bouquet.sh build-tools/*
            echo "已安装："
            wc -l build_bouquet.sh
            ls -l build-tools
          fi

          # 修正模块收集路径。
          # build_bouquet.sh 的 both_need_modules 清单是按另一套驱动目录写的，
          # melt-rebase 上这两个触摸屏模块换了位置：
          #   goodix_berlin_driver/goodix_core.ko -> goodix_9916r/goodix_core.ko
          #   xiaomi_los/xiaomi_touch.ko          -> xiaomi/xiaomi_touch.ko
          # 路径不匹配会让 strip_kmod 静默跳过（只打印 not found），
          # 这两个模块因此既不进 vendor_boot_modules 也不进 vendor_dlkm_modules，
          # 随后 make_package.py 的模块加载模拟因清单里缺文件而失败。
          #
          # 定位方式：.ko 是编译产物，源码树里只有 .c，因此不能 find *.ko。
          # 改为在源码树里找哪个 Makefile 声明了
          #   obj-... += <模块名>.o
          # 该 Makefile 所在目录即 .ko 的编译输出目录。这样不写死目录名，
          # 上游调整目录结构时也能自动适配。
          echo "=== 校正模块收集路径 ==="

          # 根据模块名定位其在内核树中的真实输出目录。
          # 注意同一模块名可能被多个 Makefile 声明（marble 的
          # goodix_core.o 同时存在于 goodix_9916r/ 和 goodix_berlin_driver/），
          # 必须结合 defconfig 判断哪个 CONFIG 真正被启用，
          # 否则可能选到没参与编译的目录。
          find_module_dir() {
            local mod="$1"
            local mk cfg
            while IFS= read -r mk; do
              [ -n "$mk" ] || continue
              # 取该行声明的 CONFIG_xxx
              cfg=$(grep -oE 'CONFIG_[A-Z0-9_]+' "$mk" | head -1)
              if [ -z "$cfg" ]; then
                continue
              fi
              # defconfig 中该 CONFIG 为 y 或 m 才说明会参与编译
              if grep -qE "^${cfg}=[ym]\$" "arch/arm64/configs/$DEFCONFIG"; then
                dirname "$mk" | sed 's|^\./||'
                return 0
              fi
            done < <(grep -rlE "^[[:space:]]*obj-[^:=]*\+=[[:space:]]*(.*[[:space:]])?${mod}\.o([[:space:]]|\$)" \
                       --include=Makefile --include=Kbuild drivers 2>/dev/null)
            return 1
          }

          for ko in goodix_core.ko xiaomi_touch.ko; do
            mod="${ko%.ko}"
            dir=$(find_module_dir "$mod") || {
              echo "  [警告] 没有已启用的 CONFIG 声明 ${mod}.o（该机型可能不含此驱动）"
              continue
            }
            want="${dir}/${ko}"
            if grep -qxF "$want" build_bouquet.sh; then
              echo "  $ko 路径已正确: $want"
              continue
            fi
            old=$(grep -E "^[^[:space:]]*/${ko}\$" build_bouquet.sh | head -1)
            if [ -n "$old" ]; then
              sed -i "s|^${old}\$|${want}|" build_bouquet.sh
              echo "  $ko: $old -> $want"
            else
              echo "  [警告] 清单中没有 $ko 条目，跳过"
            fi
          done
          echo "=== 校正后清单中的两条 ==="
          grep -E "(goodix_core|xiaomi_touch)\.ko" build_bouquet.sh || true

          # 补入遗漏的 mi_cnss_statistic.ko。
          # melt-rebase 的 qca_cld3_qca6490.ko（WLAN 驱动）依赖
          # cnss_statistic_wow_wakeup 与 wow_suspend_type 两个符号，
          # 二者由 drivers/net/wireless/mi_cnss_statistic/genl.c 导出
          # （CONFIG_MI_CNSS_STATISTIC=m，在 marble_defconfig 中已启用）。
          # 但 build_bouquet.sh 的收集清单漏了这个模块，导致它不被 strip、
          # 不进打包，make_package.py 模拟加载 qca6490 时报 Unknown symbol，
          # 并连带 39 个下游模块（rmnet_* / audio / msm_drm 等）标为未加载。
          #
          # 该模块属 vendor_dlkm 分区（与 qca6490 / cnss_* 同栈），
          # 因此补进 vendor_dlkm_need_modules，而不是 both_need_modules
          # （后者会同时落进 vendor_boot_modules，多出无用文件）。
          MI_CNSS_KO="drivers/net/wireless/mi_cnss_statistic/mi_cnss_statistic.ko"
          if [ -f "drivers/net/wireless/mi_cnss_statistic/genl.c" ]; then
            if grep -qxF "$MI_CNSS_KO" build_bouquet.sh; then
              echo "  mi_cnss_statistic.ko 已在清单中"
            else
              # 幂等插入：放在 vendor_dlkm_need_modules 的 qcacld 行之后
              if grep -qxF "drivers/staging/qcacld-3.0/qca6490.ko" build_bouquet.sh; then
                sed -i "\|^drivers/staging/qcacld-3\.0/qca6490\.ko\$|a ${MI_CNSS_KO}" build_bouquet.sh
              else
                sed -i "s|^vendor_dlkm_need_modules='\$|vendor_dlkm_need_modules='\n${MI_CNSS_KO}|" build_bouquet.sh
              fi
              if grep -qxF "$MI_CNSS_KO" build_bouquet.sh; then
                echo "  已补入 mi_cnss_statistic.ko（vendor_dlkm 分区）"
              else
                echo "::error::mi_cnss_statistic.ko 补入失败"
                exit 1
              fi
            fi
          else
            echo "  [提示] 源码树无 mi_cnss_statistic 驱动，跳过补入"
          fi

      - name: 关闭 LLVM Polly（工具链不支持）
        working-directory: kernel
        run: |
          set -euo pipefail
          # Slim LLVM 23.1.6 未启用 Polly。melt-rebase 的 arch/Kconfig 里
          # LLVM_POLLY 带 `depends on $(cc-option, -mllvm -polly)` 探测，
          # 不支持时该符号不可见，defconfig 里的 =y 会被 olddefconfig 丢弃。
          #
          # 但 melt-rebase-hyperos 的 arch/Kconfig 少了这一行 depends，
          # 于是 =y 生效，Makefile 把 -mllvm -polly 等参数传给 clang：
          #   clang (LLVM option parsing): Unknown command line argument '-polly'
          #   make[2]: *** [scripts/Makefile.build:279: scripts/mod/empty.o] Error 1
          # 编译在 prepare0 阶段就中断（约 10 秒），连内核都编不到。
          #
          # 因此在编译前把该配置显式关掉，两种分支都安全。
          for dc in "arch/arm64/configs/$DEFCONFIG"; do
            [ -f "$dc" ] || continue
            if grep -qE '^CONFIG_LLVM_POLLY=' "$dc"; then
              sed -i 's|^CONFIG_LLVM_POLLY=.*|# CONFIG_LLVM_POLLY is not set|' "$dc"
              echo "已关闭 CONFIG_LLVM_POLLY（$dc）"
            fi
          done
          grep -n "LLVM_POLLY" "arch/arm64/configs/$DEFCONFIG" || echo "defconfig 中无 LLVM_POLLY 条目"

      - name: 关闭 CONFIG_WERROR（clang 23 对 5.10 误报）
        working-directory: kernel
        run: |
          set -euo pipefail
          # clang 23.1.6 引入的两条新警告，对 5.10 老内核是误报：
          #   -Wdefault-const-init-var-unsafe
          #     typecheck() 宏里的 typeof(x) __dummy2; 只做类型对比、从不读取，
          #     但新检查认为"const 限定的对象默认初始化后未赋值"。
          #     全树 17 处，集中在 u64_to_user_ptr 之类的宏展开点。
          #   -Wuninitialized-const-pointer
          #     arch/arm64/kvm/sys_regs.c:2777 的 clidr。
          #
          # CONFIG_WERROR（init/Kconfig，default y）会把这些警告变成错误：
          #   error: default initialization of an object of type
          #          'typeof ((attr->batch.keys))' ... [-Werror,-Wdefault-const-init-var-unsafe]
          #   make[3]: *** [scripts/Makefile.build:279: kernel/bpf/syscall.o] Error 1
          #
          # melt-rebase 分支上不触发（该分支 BPF 代码较旧，未命中这些点），
          # melt-rebase-hyperos 同步了较新上游代码，因此必然撞上。
          # 这些都是警告升级、非语法/语义错误，关掉 WERROR 不会掩盖真问题。
          DC="arch/arm64/configs/$DEFCONFIG"
          if grep -qE '^CONFIG_WERROR=' "$DC"; then
            sed -i 's|^CONFIG_WERROR=.*|# CONFIG_WERROR is not set|' "$DC"
          elif ! grep -q '^# CONFIG_WERROR is not set$' "$DC"; then
            echo "# CONFIG_WERROR is not set" >> "$DC"
          fi
          grep -n "WERROR" "$DC" || true

      - name: 应用自定义版本后缀
        if: inputs.version_suffix != ''
        working-directory: kernel
        run: |
          set -euo pipefail
          # 上游 build_bouquet.sh 在 CI（USER=runner）下用
          # export LOCALVERSION=-$(git rev-parse --short HEAD)
          # 覆盖内核版本后缀，defconfig 里的 CONFIG_LOCALVERSION 会被覆盖。
          # 因此这里改写脚本，把自定义后缀拼到它自己的 LOCALVERSION 后面。
          if ! grep -q 'LOCALVERSION=-$(git rev-parse --short HEAD)' build_bouquet.sh; then
            echo "::error::build_bouquet.sh 的 LOCALVERSION 逻辑与预期不符，请核对上游改动"
            grep -n 'LOCALVERSION' build_bouquet.sh
            exit 1
          fi
          sed -i 's|export LOCALVERSION=-$(git rev-parse --short HEAD)|export LOCALVERSION=-$(git rev-parse --short HEAD)${{ inputs.version_suffix }}|' \
            build_bouquet.sh
          grep -n 'export LOCALVERSION=-$(git rev-parse' build_bouquet.sh

      - name: 校验补丁脚本资源
        run: |
          # 这一步专门区分「资源缺失」（本仓库未检出/结构变动，属于致命错误）
          # 与「补丁不适用」（内核版本不匹配，可跳过）。若不单独校验，
          # 后续 bash 调用会以 exit 127 退出并被 skip_incompatible 误当作
          # 「不适用」静默吞掉，掩盖真实问题。
          MISSING=""
          for f in \
            security_patch/apply_cve_2026_43499.sh \
            scripts/marble_features/apply.sh \
            scripts/marble_features/ksu_variant.sh; do
            [ -f "$GITHUB_WORKSPACE/$f" ] || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::本仓库补丁资源缺失:$MISSING（检查 checkout 步骤是否存在）"
            echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            ls -la "$GITHUB_WORKSPACE" 2>/dev/null || true
            exit 1
          fi
          echo "补丁脚本资源校验通过"

      - name: 自动应用 CVE-2026-43499 rtmutex 修复链
        if: inputs.cve_2026_43499_patch
        working-directory: kernel
        env:
          SKIP_INCOMPATIBLE: ${{ inputs.skip_incompatible }}
        run: |
          set -euo pipefail
          # 脚本以当前目录为内核树根，使用 kernel/locking/rtmutex.c 等相对路径。
          # marble 是设备树内核，内核树根就是 kernel/，与 GKI 的
          # KERNEL_ROOT/common 等价，目录结构一致。
          if [ ! -f kernel/locking/rtmutex.c ]; then
            echo "::error::未找到 kernel/locking/rtmutex.c，当前目录不是内核树根"
            exit 1
          fi

          # 从 Makefile 取实际 SUBLEVEL（5.10 下 patch_chain_is_required 恒为 true，
          # 但仍需合法数字，否则脚本以 exit 2 退出）
          SUBLEVEL=$(grep '^SUBLEVEL = ' Makefile | awk '{print $3}')
          echo "内核 SUBLEVEL=$SUBLEVEL"

          if bash "$GITHUB_WORKSPACE/security_patch/apply_cve_2026_43499.sh" \
              5.10 "$SUBLEVEL" "$GITHUB_WORKSPACE/security_patch"; then
            echo "CVE-2026-43499 处理完成"
          else
            if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
              echo "::warning title=CVE-2026-43499 已跳过::补丁不适用，已跳过（构建未中断）"
              echo "> ⏭️ **CVE-2026-43499** 已自动跳过：补丁不适用" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::CVE-2026-43499 修复链应用失败"
              exit 1
            fi
          fi

      - name: 应用功能补丁（BBG / Re-Kernel / NoMount / ZRAM / 网络增强 / WiFi）
        working-directory: kernel
        run: |
          set -uo pipefail
          # 用数组传参，避免仓库 URL 含特殊字符时的引号问题
          ARGS=(
            --kernel-root "$PWD"
            --defconfig "$DEFCONFIG"
            --kernel-version 5.10
            --android-version android12
            --skip-incompatible "$SKIP_INCOMPATIBLE"
            --patches-root "$GITHUB_WORKSPACE"
          )
          [ "${{ inputs.use_bbg }}" = "true" ]        && ARGS+=(--bbg)
          [ "${{ inputs.use_rekernel }}" = "true" ]   && ARGS+=(--rekernel)
          [ "${{ inputs.use_nomount }}" = "true" ]    && ARGS+=(--nomount)
          [ "${{ inputs.use_zram }}" = "true" ]       && ARGS+=(--zram)
          [ "${{ inputs.use_net_enhance }}" = "true" ] && ARGS+=(--net-enhance)
          if [ "${{ inputs.wlan_fix }}" = "true" ]; then
            ARGS+=(--wlan-fix)
            ARGS+=(--wlan-repo "${{ inputs.wlan_repo }}")
            ARGS+=(--wlan-ref  "${{ inputs.wlan_ref }}")
          fi

          if [ "${#ARGS[@]}" -eq 6 ]; then
            echo "未选择任何功能补丁，跳过"
            exit 0
          fi

          bash "$GITHUB_WORKSPACE/scripts/marble_features/apply.sh" "${ARGS[@]}"

      - name: 校验构建脚本
        working-directory: kernel
        run: |
          set -euo pipefail
          # 脚本与 build-tools 已由前面步骤就位，这里只做完整性校验。
          if [ ! -f build_bouquet.sh ]; then
            echo "::error::build_bouquet.sh 缺失"
            exit 1
          fi

          # build_bouquet.sh 依赖 build-tools/ 里的 dtb 合并与 dtbo 签名工具，
          # 缺任何一个，后面 dtb/dtbo 生成阶段都会失败。
          MISSING=""
          for t in merge_dtbs.py mkdtboimg.py avbtool fdtput fdtget \
                   fdtoverlay fdtoverlaymerge ufdt_apply_overlay; do
            if [ ! -f "build-tools/$t" ]; then
              MISSING="$MISSING $t"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::build-tools 缺少:$MISSING"
            ls -l build-tools 2>/dev/null || true
            exit 1
          fi
          chmod +x build_bouquet.sh build-tools/*

          echo "=== build_bouquet.sh ==="
          wc -l build_bouquet.sh
          grep -n '^DEFCONFIG=' build_bouquet.sh
          echo "=== build-tools ==="
          ls -l build-tools

          # 脚本内写死的工具链路径必须与下载的版本一致，否则编译找不到 clang
          EXPECT="llvm-${SLIM_LLVM}-x86_64"
          if ! grep -q "$EXPECT" build_bouquet.sh; then
            echo "::error::build_bouquet.sh 期望的工具链与所选版本不一致"
            grep -n 'CLANG_PATH=' build_bouquet.sh
            echo "所选版本：$SLIM_LLVM（期望路径含 $EXPECT）"
            exit 1
          fi
          echo "工具链版本校验通过：$EXPECT"

      - name: 编译基础内核
        if: env.BUILD_BASE == 'true'
        working-directory: kernel
        env:
          BUILD_TOOLCHAIN: ${{ env.GITHUB_WORKSPACE }}/build_toolchain
        run: |
          set -euo pipefail
          export PATH="$LLVM_BIN:$PATH"
          export OUT_DIR="$HOME/Bouquet_marble_out"
          ccache --max-size=2G
          ccache --zero-stats
          echo "clang: $(which clang) $(clang --version | head -1)"
          ./build_bouquet.sh --defconfig "$DEFCONFIG" -- Image modules 2>&1 | tee build-base.log

          # build_bouquet.sh 在未传 --ksu/--susfs 时把产物命名为 $OUT_DIR/Image。
          # 先备份为上表中的 Image.base，再用内核树里的实际产物覆盖 Image，
          # 保证后续两轮编译不会把它冲掉。
          [ -f "$OUT_DIR/Image" ] && cp -f "$OUT_DIR/Image" "$OUT_DIR/Image.base" || true
          cp -f out/arch/arm64/boot/Image "$OUT_DIR/Image"
          cp -f out/vmlinux.symvers "$OUT_DIR/Image_vmlinux.symvers"
          echo "基础版 Image 已锁定: $(stat -c %s "$OUT_DIR/Image") bytes"

      - name: 编译 KernelSU 版本
        if: env.BUILD_KSU == 'true'
        working-directory: kernel
        run: |
          set -euo pipefail
          export PATH="$LLVM_BIN:$PATH"
          export OUT_DIR="$HOME/Bouquet_marble_out"

          # KernelSU 必须在基础编译之后才接入：drivers/kernelsu/ 存在时
          # drivers/Makefile 的 obj-y 会把它编进内核，若在基础编译前接入，
          # 「基础版」也会带上 KernelSU。
          bash "$GITHUB_WORKSPACE/scripts/marble_features/ksu_variant.sh" \
            --kernel-root "$PWD" \
            --variant "${{ inputs.ksu_variant }}" \
            --with-susfs "false" \
            --kernel-version 5.10 \
            --android-version android12 \
            --ksu-commit "${{ inputs.ksu_commit }}" \
            --skip-incompatible "$SKIP_INCOMPATIBLE" \
            --patches-root "$GITHUB_WORKSPACE"

          # 不传 --ksu：该选项会安装 kernel_tree_cleanup trap，
          # 退出时 git checkout 还原 fs/ drivers/ include/ kernel/ security/ mm/，
          # 使功能补丁与 KernelSU 集成失效。此处用 --noclean 增量编译
          # （复用基础编译留下的已编译对象）。
          # 注意：build_bouquet.sh 在 --noclean 下仍会执行
          # `make $DEFCONFIG`，会覆盖 out/.config，所以 CONFIG_KSU
          # 必须写进 defconfig 而不是 out/.config。
          if ! grep -q '^CONFIG_KSU=y$' "arch/arm64/configs/$DEFCONFIG"; then
            echo "CONFIG_KSU=y" >> "arch/arm64/configs/$DEFCONFIG"
          fi

          ./build_bouquet.sh --noclean --defconfig "$DEFCONFIG" -- Image modules 2>&1 | tee build-ksu.log

          grep -q '^CONFIG_KSU=y$' out/.config || { echo "::error::CONFIG_KSU 未能生效"; exit 1; }
          # 把产物另存为 Image_ksu（上游脚本只在 with_ksu 时才这么命名）
          cp -f out/arch/arm64/boot/Image "$OUT_DIR/Image_ksu"
          cp -f out/vmlinux.symvers "$OUT_DIR/Image_ksu_vmlinux.symvers"

          # 本轮把 $OUT_DIR/Image 覆盖成 KSU 版，还原基础版供打包使用
          if [ -f "$OUT_DIR/Image.base" ]; then
            cp -f "$OUT_DIR/Image.base" "$OUT_DIR/Image"
            echo "已还原 $OUT_DIR/Image 为基础版"
          fi

      - name: 编译 KernelSU + SUSFS 版本
        if: env.BUILD_SUSFS == 'true'
        working-directory: kernel
        run: |
          set -euo pipefail
          export PATH="$LLVM_BIN:$PATH"
          export OUT_DIR="$HOME/Bouquet_marble_out"

          # SUSFS 必须在整树重编前打入：50_add 会改 fs/exec.c 等核心文件。
          bash "$GITHUB_WORKSPACE/scripts/marble_features/ksu_variant.sh" \
            --kernel-root "$PWD" \
            --variant "${{ inputs.ksu_variant }}" \
            --with-susfs "true" \
            --kernel-version 5.10 \
            --android-version android12 \
            --ksu-commit "${{ inputs.ksu_commit }}" \
            --skip-incompatible "$SKIP_INCOMPATIBLE" \
            --patches-root "$GITHUB_WORKSPACE"

          # 全量编译（--defconfig 触发 mrproper + defconfig），
          # CONFIG_KSU / CONFIG_KSU_SUSFS* 写进 defconfig 以保证生效。
          if ! grep -q '^CONFIG_KSU=y$' "arch/arm64/configs/$DEFCONFIG"; then
            echo "CONFIG_KSU=y" >> "arch/arm64/configs/$DEFCONFIG"
          fi
          # Kconfig 位置随变体布局不同：
          #   tiann        drivers/kernelsu/kernel/Kconfig
          #   官方三家     drivers/kernelsu/Kconfig（软链到 KernelSU/kernel）
          KSU_KCONFIG=""
          for _k in drivers/kernelsu/kernel/Kconfig drivers/kernelsu/Kconfig; do
            [ -f "$_k" ] && { KSU_KCONFIG="$_k"; break; }
          done
          unset _k
          if [ -z "$KSU_KCONFIG" ]; then
            echo "::error::未找到 KernelSU 的 Kconfig（drivers/kernelsu*/Kconfig）"
            ls -la drivers/kernelsu* 2>/dev/null || true
            exit 1
          fi
          echo "KernelSU Kconfig: $KSU_KCONFIG"

          for _c in KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT \
                    KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                    KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP; do
            grep -qE "^[[:space:]]*config[[:space:]]+${_c}\$" "$KSU_KCONFIG" 2>/dev/null \
              && ! grep -q "^CONFIG_${_c}=y\$" "arch/arm64/configs/$DEFCONFIG" \
              && echo "CONFIG_${_c}=y" >> "arch/arm64/configs/$DEFCONFIG"
          done
          unset _c

          ./build_bouquet.sh --defconfig "$DEFCONFIG" -- Image modules 2>&1 | tee build-susfs.log
          cp -f out/arch/arm64/boot/Image "$OUT_DIR/Image_susfs"
          cp -f out/vmlinux.symvers "$OUT_DIR/Image_susfs_vmlinux.symvers"

          # 单一变体模式（仅SUSFS）下没有基础版与 KSU 版，
          # 用 SUSFS 产物占位，保证 make_package.py 的三个槽位都有镜像。
          if [ "$SINGLE_VARIANT" = "true" ]; then
            cp -f "$OUT_DIR/Image_susfs" "$OUT_DIR/Image"
            cp -f "$OUT_DIR/Image_susfs" "$OUT_DIR/Image_ksu"
            echo "单一变体模式：Image / Image_ksu 均以 SUSFS 产物占位"
          elif [ -f "$OUT_DIR/Image.base" ]; then
            # 本轮同样把 $OUT_DIR/Image 覆盖成 SUSFS 版，
            # 用基础版备份还原，保证打包时 Image=基础版。
            cp -f "$OUT_DIR/Image.base" "$OUT_DIR/Image"
            echo "已还原 $OUT_DIR/Image 为基础版"
          fi

          # 还原被 SUSFS 主补丁改动的核心文件，避免污染后续步骤/产物
          git checkout -- fs/ include/ 2>/dev/null || true

      - name: 整理编译失败日志
        if: failure()
        run: |
          mkdir -p fail-logs
          cp kernel/build-*.log fail-logs/ 2>/dev/null || true
          cp kernel/out/.config fail-logs/ 2>/dev/null || true

      - name: 上传编译失败日志
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Melt-Build-Logs
          path: fail-logs/*
          if-no-files-found: ignore

      - name: 安装打包依赖
        run: |
          set -euo pipefail
          # make_package.py 硬依赖 7za 与 hdiffz（脚本内有 shutil.which 断言）
          sudo apt-get install -y --no-install-recommends p7zip-full
          mkdir -p ~/.local/bin
          cd /tmp
          curl -L --retry 5 -o hd.zip \
            https://github.com/sisong/HDiffPatch/releases/download/v4.12.2/hdiffpatch_v4.12.2_bin_linux64.zip
          unzip -o -q hd.zip
          cp linux64/hdiffz linux64/hpatchz ~/.local/bin/ 2>/dev/null || cp ./hdiffz ./hpatchz ~/.local/bin/
          chmod +x ~/.local/bin/*
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          (command -v 7za || command -v 7z) && ~/.local/bin/hdiffz --help 2>&1 | head -2 || true

      - name: 汇总产物
        run: |
          set -euo pipefail
          export OUT_DIR="$HOME/Bouquet_marble_out"
          echo "=== 上游输出目录 ==="
          ls -lh "$OUT_DIR" || true
          find "$OUT_DIR" -maxdepth 2 -type d | head -20

          mkdir -p dist
          # 三个固定镜像名（避免 Image.base 混入）
          for img in Image Image_ksu Image_susfs; do
            [ -f "$OUT_DIR/$img" ] && cp -f "$OUT_DIR/$img" dist/ || true
          done
          # make_package.py 需要 vmlinux.symvers 做模块符号解析，
          # 优先取与 Image（基础版）对应的那份；单一变体模式下
          # 只有 SUSFS 版，回退到它。
          for sv in Image_vmlinux.symvers Image_susfs_vmlinux.symvers \
                    Image_ksu_vmlinux.symvers; do
            if [ -f "$OUT_DIR/$sv" ]; then
              cp -f "$OUT_DIR/$sv" dist/Image_vmlinux.symvers
              echo "已带入符号表: $sv -> dist/Image_vmlinux.symvers"
              break
            fi
          done
          cp -r "$OUT_DIR"/devicetree dist/ 2>/dev/null || true
          cp -r "$OUT_DIR"/alt_kernel_modules dist/ 2>/dev/null || true
          cp -r "$OUT_DIR"/vendor_boot_modules dist/ 2>/dev/null || true
          cp -r "$OUT_DIR"/vendor_dlkm_modules dist/ 2>/dev/null || true

          echo "=== dist ==="
          ls -lh dist
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::未产出任何文件"
            exit 1
          fi

      - name: 打包 AnyKernel3
        run: |
          set -euo pipefail
          # 打包模板按输入选择。两个分支的差异：
          #   Marble-Melt     接受原厂 HyperOS / MIUI（keycode_select 让用户确认），
          #                   对 MIUI 有完整分支处理（电池/耳机键/msm_drm/
          #                   camera/ir 各自按 MIUI 取值）；
          #                   但分支本身缺模块清单，需从 Bouquet 补。
          #   Marble-Bouquet  检测到 MiuiBooster.jar 就 abort "不支持的 rom"，
          #                   还强制要求 vendor_dlkm 的 xiaomi_touch.ko 含 lineage，
          #                   只面向 LineageOS / AOSPA 一类的 OSS 内核 ROM；
          #                   清单文件自带。
          AK_REPO="https://github.com/Pzqqt/AnyKernel3.git"
          TEMPLATE_RAW="${{ inputs.package_template }}"
          case "$TEMPLATE_RAW" in
            Marble-Melt*)   AK_BRANCH="Marble-Melt";    NEED_MANIFEST=1 ;;
            Marble-Bouquet*) AK_BRANCH="Marble-Bouquet"; NEED_MANIFEST=0 ;;
            *) echo "::error::未知打包模板: $TEMPLATE_RAW"; exit 1 ;;
          esac
          echo "打包模板: $AK_BRANCH（补清单: $NEED_MANIFEST）"

          git clone --depth=1 -b "$AK_BRANCH" "$AK_REPO" ak3

          if [ "$NEED_MANIFEST" = "1" ]; then
            # Melt 无 CI、缺清单文件，从 Bouquet 借（那是原厂 HyperOS 的模块表）
            git clone --depth=1 -b Marble-Bouquet "$AK_REPO" ak3-manifest
            for part in _vendor_boot_modules _vendor_dlkm_modules; do
              for f in modules.load modules.load.recovery modules.blocklist modules.options; do
                src="ak3-manifest/_modules_hyperos/$part/$f"
                [ -f "$src" ] && cp -f "$src" "ak3/_modules_hyperos/$part/$f"
              done
            done
            rm -rf ak3-manifest
            echo "=== 补齐后的清单文件 ==="
            ls -l ak3/_modules_hyperos/_vendor_boot_modules/ ak3/_modules_hyperos/_vendor_dlkm_modules/
          fi

          cd ak3
          rm -f ./Image*

          # 按上游 CI 的方式填充打包内容
          [ -f ../dist/devicetree/ukee.dtb ] && cp -f ../dist/devicetree/ukee.dtb ./_dtb/dtb
          if [ "$AK_BRANCH" = "Marble-Melt" ]; then
            # Melt 的 anykernel.sh 需要两份 dtbo：
            #   is_oss_kernel_rom -> dtbo-1.img
            #   其余（MIUI/HyperOS）-> dtbo-0.img
            # 整树自编时 dtbo 也是自编产物，两条路径用同一份即可
            # （原厂模板中两者的差异只在 GPU pwrlevels，刷机时脚本会用
            #  设备原 dtb 的频率电压表回填，见 copy_gpu_pwrlevels_conf）。
            if [ -f ../dist/devicetree/dtbo.img ]; then
              cp -f ../dist/devicetree/dtbo.img ./_dtb/dtbo-0.img
              cp -f ../dist/devicetree/dtbo.img ./_dtb/dtbo-1.img
              rm -f ./_dtb/dtbo.img
              echo "已生成 dtbo-0.img / dtbo-1.img（同一份自编 dtbo）"
            fi
          else
            [ -f ../dist/devicetree/dtbo.img ] && cp -f ../dist/devicetree/dtbo.img ./_dtb/dtbo.img
          fi
          [ -d ../dist/alt_kernel_modules ] && cp -f ../dist/alt_kernel_modules/* ./_modules_hyperos/_alt/ 2>/dev/null || true
          [ -d ../dist/vendor_boot_modules ] && cp -f ../dist/vendor_boot_modules/* ./_modules_hyperos/_vendor_boot_modules/ 2>/dev/null || true
          [ -d ../dist/vendor_dlkm_modules ] && cp -f ../dist/vendor_dlkm_modules/* ./_modules_hyperos/_vendor_dlkm_modules/ 2>/dev/null || true
          # Image 与 Image_*_vmlinux.symvers 一并带入（make_package.py 用相对路径引用）
          cp -f ../dist/Image* ./

          # 把 mi_cnss_statistic.ko 补进 modules.load。
          #
          # 只把它放进模块目录还不够。simulate_load_kernel_modules.py 的
          # _load_module() 开头有一句：
          #     if module_path_ not in remain_modules: return True
          # remain_modules 初始化为 modules.load 的内容，所以不在清单里的
          # 模块会被当作「已满足」直接跳过，根本不会加载——即使文件在目录、
          # depmod 也记录了依赖。这就是上一轮补了文件仍报 Unknown symbol 的原因。
          # 必须同时写进 modules.load，且排在 qca_cld3_qca6490.ko 之前。
          LOAD_FILE="./_modules_hyperos/_vendor_dlkm_modules/modules.load"
          if [ -f "$LOAD_FILE" ] && [ -f "../dist/vendor_dlkm_modules/mi_cnss_statistic.ko" ]; then
            if grep -qxF "mi_cnss_statistic.ko" "$LOAD_FILE"; then
              echo "modules.load 已含 mi_cnss_statistic.ko"
            else
              # 插到首个 qca_cld3_qca6490.ko 之前，保证符号提供者先加载
              if grep -qxF "qca_cld3_qca6490.ko" "$LOAD_FILE"; then
                sed -i '0,/^qca_cld3_qca6490\.ko$/s//mi_cnss_statistic.ko\nqca_cld3_qca6490.ko/' "$LOAD_FILE"
              else
                # 锚点缺失时追加到末尾（依赖递归仍会处理顺序）
                echo "mi_cnss_statistic.ko" >> "$LOAD_FILE"
              fi
              if grep -qxF "mi_cnss_statistic.ko" "$LOAD_FILE"; then
                echo "已插入 mi_cnss_statistic.ko 到 modules.load（qca6490 之前）"
              else
                echo "::error::mi_cnss_statistic.ko 插入 modules.load 失败"
                exit 1
              fi
            fi
            echo "=== modules.load 中相关行 ==="
            grep -n -B1 -A1 "mi_cnss_statistic" "$LOAD_FILE" || true
          fi

          # 清理 modules.load 中指向「本次没编出来的模块」的条目。
          #
          # 清单（从 Bouquet 借的原厂模块表）是按上游某个源码状态写的，
          # 与当前源码分支不一定对得上。例如 melt-rebase-hyperos 删掉了
          # drivers/staging/kshrink_slabd/，但清单第 100 行仍要求
          # kshrink_slabd.ko，模拟加载时报：
          #   Exception: The module file does not exist:
          #     .../_vendor_boot_modules/kshrink_slabd.ko!
          #
          # 做法：逐行检查该模块文件是否真实存在于对应目录，
          # 不存在则从清单移除并记录。这样源码分支怎么变都不会卡住打包。
          for pair in "_vendor_boot_modules:0" "_vendor_dlkm_modules:0"; do
            dir="${pair%%:*}"
            for mf in "_modules_hyperos/$dir/modules.load" \
                      "_modules_hyperos/$dir/modules.load.recovery"; do
              [ -f "$mf" ] || continue
              removed=0
              keep="$(mktemp)"
              while IFS= read -r line || [ -n "$line" ]; do
                # 清单是 CRLF 行尾，取模块名时要去掉 \r，否则文件名
                # 带上回车符会被判定为不存在，把整份清单清空。
                crlf=""
                case "$line" in *$'\r') crlf=$'\r'; line="${line%$'\r'}" ;; esac
                case "$line" in
                  ''|'#'*) printf '%s%s\n' "$line" "$crlf" >> "$keep"; continue ;;
                  *.ko)
                    if [ -f "_modules_hyperos/$dir/$line" ]; then
                      printf '%s%s\n' "$line" "$crlf" >> "$keep"
                    else
                      echo "  从 $mf 移除缺失模块: $line"
                      removed=$((removed + 1))
                    fi
                    ;;
                  *) printf '%s%s\n' "$line" "$crlf" >> "$keep" ;;
                esac
              done < "$mf"
              mv "$keep" "$mf"
              if [ "$removed" -gt 0 ]; then
                echo "  $mf 共移除 $removed 条"
              fi
            done
          done

          ls -lh . | head -20

          # VMLINUX_SYMVERS_FILE 路径修正。
          # Marble-Melt 里写死成作者本机绝对路径
          # （/home/pzqqt/working/.../out/vmlinux.symvers），必须改成
          # 同级文件名 'Image_vmlinux.symvers'——那份符号表已由
          # ../dist/Image* 拷进本目录。
          if grep -q "^VMLINUX_SYMVERS_FILE = '/" make_package.py; then
            echo "检测到绝对路径，改写为相对路径"
            sed -i "s|^VMLINUX_SYMVERS_FILE = .*|VMLINUX_SYMVERS_FILE = 'Image_vmlinux.symvers'|" make_package.py
          fi
          grep -n 'VMLINUX_SYMVERS_FILE =' make_package.py

          # main_multi 强制 assert Image 与 Image_ksu 同时存在；
          # 未构建 KSU 时（或 KSU 构建失败）用基础 Image 占位，
          # 使打包流程仍能跑通。
          if [ ! -f Image_ksu ]; then
            echo "::warning::Image_ksu 不存在（未启用或构建失败），用 Image 占位"
            cp -f Image Image_ksu
          fi

          # 同理：禁用SUSFS 或未构建时用 Image_ksu（其次 Image）占位，
          # 避免 make_package.py 的 assert 中断打包。
          if [ ! -f Image_susfs ]; then
            if [ -f Image_ksu ]; then
              echo "::warning::Image_susfs 不存在（未启用或构建失败），用 Image_ksu 占位"
              cp -f Image_ksu Image_susfs
            else
              echo "::warning::Image_susfs 不存在，用 Image 占位"
              cp -f Image Image_susfs
            fi
          fi

          echo "=== 调用 make_package.py ==="
          python3 ./make_package.py "ci-${BUILD_DATE}-${KERNEL_SHORT}"

      - name: 收集 zip
        run: |
          set -euo pipefail
          mkdir -p package
          find . -maxdepth 2 -name '*.zip' -not -path './kernel/*' -exec cp {} package/ \;
          ls -lh package
          if [ -z "$(ls -A package)" ]; then
            echo "::error::未生成 zip"
            exit 1
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: Melt-marble-${{ env.KERNEL_SHORT }}
          path: package/*.zip
          if-no-files-found: error

      - name: 构建摘要
        if: always()
        run: |
          {
            echo ""
            echo "### 结果"
            echo ""
            echo "- 内核提交: \`${KERNEL_SHA:-unknown}\`"
            echo "- 工具链: Slim LLVM $SLIM_LLVM"
          } >> $GITHUB_STEP_SUMMARY

  release:
    if: ${{ always() && !cancelled() && inputs.release_type != 'Actions' && needs.build-marble.result == 'success' }}
    needs: build-marble
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.WORKFLOW_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}

    steps:
      # release job 里 `gh release create --target <sha>` 需要在 git 仓库
      # 上下文中执行，否则报：
      #   failed to run git: fatal: not a git repository
      # 原工作流缺这一步，release_type 非 Actions 时必然失败。
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 下载产物
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded

      - name: 生成版本标签
        run: |
          set -euo pipefail
          BASE="melt-$(date -u '+%Y%m%d')"
          FULL_TAG=$(gh api "repos/$REPO_OWNER/$REPO_NAME/tags" --jq '.[0].name' 2>/dev/null || echo "")
          if [[ "$FULL_TAG" == "$BASE"-r* ]]; then
            R=$(echo "$FULL_TAG" | sed 's/.*-r//'); R=$((R + 1))
          else
            R=1
          fi
          echo "NEW_TAG=${BASE}-r${R}" >> $GITHUB_ENV

      - name: 创建 Release
        run: |
          set -euo pipefail
          FLAGS=""
          [ "${{ inputs.release_type }}" = "Pre-Release" ] && FLAGS="--prerelease"
          gh release create "$NEW_TAG" \
            --title "Melt Kernel $NEW_TAG" \
            --notes "Melt Kernel for Redmi Note 12 Turbo (marble) / Poco F5 (marblein)

          - 源码: \`${{ inputs.kernel_repo }}\` @ \`${{ inputs.kernel_branch }}\`
          - defconfig: \`${{ inputs.defconfig }}\`
          - 工具链: Slim LLVM ${{ inputs.slim_llvm_version }}
          - KernelSU 变体: ${{ inputs.ksu_variant }}（模式: ${{ inputs.ksu_mode }}）
          - 功能补丁: ZRAM=${{ inputs.use_zram }} BBG=${{ inputs.use_bbg }} Re-Kernel=${{ inputs.use_rekernel }} NoMount=${{ inputs.use_nomount }} 网络增强=${{ inputs.use_net_enhance }}
          - CVE-2026-43499: ${{ inputs.cve_2026_43499_patch }}

          > 刷入前请备份原厂 boot 镜像。" \
            --target "${{ github.sha }}" $FLAGS

      - name: 上传资产
        run: |
          set -euo pipefail
          find ./downloaded -type f -name '*.zip' -print0 | while IFS= read -r -d '' f; do
            echo "上传 $f"
            gh release upload "$NEW_TAG" "$f" --clobber
          done

      - name: 发布摘要
        run: |
          echo "- **标签**: $NEW_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **链接**: ${{ github.server_url }}/$REPO_OWNER/$REPO_NAME/releases/tag/$NEW_TAG" >> $GITHUB_STEP_SUMMARY
